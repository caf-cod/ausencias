name: Atualizar calendário federal
on:
  schedule:
    - cron: '17 10 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/sync_calendar.py'
      - 'scripts/test_sync_calendar.py'
      - '.github/workflows/calendar.yml'
permissions:
  contents: write
concurrency:
  group: calendario-federal
  cancel-in-progress: false
jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar extratores
        run: python -m unittest discover -s scripts -p 'test_sync_calendar.py' -v
      - name: Consultar fontes oficiais
        run: python scripts/sync_calendar.py
      - name: Publicar arquivo de calendário
        run: |
          git config user.name "Calendário CAF"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/calendario-federal.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Atualizar calendário federal e relatório de consulta"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
